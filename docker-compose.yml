services:
  db:
    image: postgres:16-alpine
    container_name: zakat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zakat_db}
      POSTGRES_USER: ${POSTGRES_USER:-zakat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zakat_user} -d ${POSTGRES_DB:-zakat_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zakat-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zakat-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-zakat_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-zakat_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_SEED_DEFAULT_USERS: ${APP_SEED_DEFAULT_USERS:-true}
      APP_INITIAL_ADMIN_PASSWORD: ${APP_INITIAL_ADMIN_PASSWORD:?Set APP_INITIAL_ADMIN_PASSWORD in .env}
      SWAGGER_PUBLIC: ${SWAGGER_PUBLIC:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - zakat-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zakat-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - zakat-network

volumes:
  postgres_data:
    name: zakat_postgres_data

networks:
  zakat-network:
    name: zakat-network
    driver: bridge
