spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERINGS=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false # H2 tests use Hibernate create-drop; PostgreSQL integration tests use Flyway

app:
  jwt:
    secret: test-secret-key-must-be-very-long-and-secure-for-hmac-sha-algorithms-iqra-test!
    expiration-ms: 3600000
  cors:
    allowed-origins: "*"
